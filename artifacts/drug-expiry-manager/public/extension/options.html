<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LavaBMS Drug Expiry Alerts</title>
    <style>
      :root { color: #18302a; background: #f1f7f4; font: 16px/1.5 Inter, system-ui, sans-serif; }
      body { max-width: 680px; margin: 0 auto; padding: 56px 22px; }
      main { padding: 32px; border: 1px solid #d7e8df; border-radius: 20px; background: #fff; box-shadow: 0 18px 48px rgba(16, 56, 42, .1); }
      h1 { margin: 0; font-size: 28px; letter-spacing: -.04em; }
      p { color: #5d786e; }
      label { display: block; margin: 28px 0 8px; font-weight: 700; }
      input { width: 100%; padding: 13px 14px; border: 1px solid #bdd4ca; border-radius: 10px; box-sizing: border-box; font: inherit; }
      button { margin-top: 18px; padding: 12px 16px; border: 0; border-radius: 10px; color: #fff; background: #146c50; cursor: pointer; font: inherit; font-weight: 700; }
      #status { min-height: 24px; margin-top: 14px; color: #287a43; font-weight: 700; }
      code { padding: 2px 5px; border-radius: 4px; background: #eef5f1; }
    </style>
  </head>
  <body>
    <main>
      <h1>LavaBMS Drug Expiry Alerts</h1>
      <p>Connect this extension to the API used by your admin console. It will watch medicine fields in LavaBMS at <code>http://lava-server:62/pos</code>.</p>
      <label for="apiBaseUrl">API base URL</label>
      <input id="apiBaseUrl" type="url" placeholder="https://your-app.replit.app/api" />
      <button id="save" type="button">Save connection</button>
      <div id="status" role="status"></div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
